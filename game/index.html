<canvas id="game" width="1280" height="720" tabindex="0" aria-label="Lantern Ward. WASD or arrows move. Mouse aims. Hold mouse or Space to burn shadows; release to collect embers. Enter starts or restarts. M mutes. P pauses."></canvas>
